name: Installer image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: installer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  linux-bundle:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Build Linux bundle
        run: |
          chmod +x ./scripts/build_linux.sh
          ./scripts/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DarkLab-linux-x86_64
          path: dist/DarkLab-linux-x86_64.tar.gz
          if-no-files-found: error

  windows-bundle:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows bundle
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DarkLab-windows-x64
          path: dist/DarkLab-windows-x64.zip
          if-no-files-found: error

  dmg:
    needs: [linux-bundle, windows-bundle]
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: DarkLab
          ref: main
          fetch-depth: 0
          token: ${{ secrets.ACTIONS_PUSH_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: fgalyasz/TenPrintSoftware
          path: TenPrintSoftware
          ref: main
          fetch-depth: 0
          token: ${{ secrets.ACTIONS_PUSH_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install company site tools
        working-directory: TenPrintSoftware
        run: npm ci
      - name: Install native deps
        run: brew install inih
      - name: Import signing identity
        working-directory: DarkLab
        env:
          CODESIGN_P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
          CODESIGN_KEYCHAIN_PASSWORD: ${{ secrets.CODESIGN_KEYCHAIN_PASSWORD }}
        run: bash scripts/ci_import_signing.sh darklab-signing "DarkLab Local"
      - name: Build installer image
        working-directory: DarkLab
        run: |
          chmod +x ./scripts/build_dmg.sh ./scripts/ci_import_signing.sh ./scripts/ci_commit_release.sh
          ./scripts/build_dmg.sh
      - uses: actions/download-artifact@v4
        with:
          name: DarkLab-linux-x86_64
          path: DarkLab/dist
      - uses: actions/download-artifact@v4
        with:
          name: DarkLab-windows-x64
          path: DarkLab/dist
      - name: Sync and commit catalogue version
        working-directory: TenPrintSoftware
        run: |
          set -euo pipefail
          npm run sync:versions
          npm run build
      - name: Commit version
        working-directory: DarkLab
        run: bash scripts/ci_commit_release.sh
      - name: Commit company catalogue version
        working-directory: DarkLab
        env:
          TENPRINT_ROOT: ${{ github.workspace }}/TenPrintSoftware
        run: bash scripts/ci_commit_release.sh company
      - uses: actions/upload-artifact@v4
        with:
          name: DarkLab-installer
          path: DarkLab/dist/DarkLab.dmg
          if-no-files-found: error
      - name: Notify on dmg failure
        if: failure()
        working-directory: TenPrintSoftware
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PUSH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
          CONTACT_FROM: ${{ secrets.CONTACT_FROM }}
          NOTIFY_MODE: failure
          WORKFLOW_FILE: installer.yml
          WORKFLOW_NAME: Installer image
        run: |
          set -euo pipefail
          export RELEASE_VERSION
          RELEASE_VERSION="$(tr -d ' \t\n\r' < ../DarkLab/docs/version.txt 2>/dev/null || true)"
          if [[ -f scripts/notify_ci_status.mjs ]]; then
            node scripts/notify_ci_status.mjs
          fi

  publish-sites:
    needs: [dmg]
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: DarkLab
          ref: main
          fetch-depth: 0
          token: ${{ secrets.ACTIONS_PUSH_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: fgalyasz/TenPrintSoftware
          path: TenPrintSoftware
          ref: main
          fetch-depth: 0
          token: ${{ secrets.ACTIONS_PUSH_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: TenPrintSoftware/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install company site tools
        working-directory: TenPrintSoftware
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: DarkLab-installer
          path: DarkLab/dist
      - uses: actions/download-artifact@v4
        with:
          name: DarkLab-linux-x86_64
          path: DarkLab/dist
      - uses: actions/download-artifact@v4
        with:
          name: DarkLab-windows-x64
          path: DarkLab/dist
      - name: Restore Cloudflare login
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PUSH_TOKEN }}
          WRANGLER_CONFIG: ${{ secrets.WRANGLER_CONFIG }}
          WRANGLER_BIN: ${{ github.workspace }}/TenPrintSoftware/node_modules/.bin/wrangler
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "CLOUDFLARE_API_TOKEN present; skipping oauth restore."
            exit 0
          fi
          chmod +x DarkLab/scripts/ci_restore_wrangler.sh
          DarkLab/scripts/ci_restore_wrangler.sh
      - name: Deploy product site
        working-directory: DarkLab
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x ./scripts/deploy_site.sh ./scripts/ensure_cloudflare_token.sh
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            unset CLOUDFLARE_API_TOKEN
          fi
          ./scripts/deploy_site.sh
      - name: Publish company catalogue
        working-directory: TenPrintSoftware
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npm run sync:versions
          npm run build
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            npm run deploy
          else
            unset CLOUDFLARE_API_TOKEN
            npm run deploy
          fi
      - name: Persist refreshed Cloudflare login
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x DarkLab/scripts/ci_persist_wrangler.sh
          DarkLab/scripts/ci_persist_wrangler.sh force
      - name: Notify on first success or recovery
        if: success()
        working-directory: TenPrintSoftware
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PUSH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
          CONTACT_FROM: ${{ secrets.CONTACT_FROM }}
          NOTIFY_MODE: success
          WORKFLOW_FILE: installer.yml
          WORKFLOW_NAME: Installer image
        run: |
          set -euo pipefail
          export RELEASE_VERSION
          RELEASE_VERSION="$(tr -d ' \t\n\r' < ../DarkLab/docs/version.txt 2>/dev/null || true)"
          if [[ -f scripts/notify_ci_status.mjs ]]; then
            node scripts/notify_ci_status.mjs
          else
            node scripts/notify_installer_recovery.mjs
          fi
      - name: Notify on failure
        if: failure()
        working-directory: TenPrintSoftware
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PUSH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
          CONTACT_FROM: ${{ secrets.CONTACT_FROM }}
          NOTIFY_MODE: failure
          WORKFLOW_FILE: installer.yml
          WORKFLOW_NAME: Installer image
        run: |
          set -euo pipefail
          export RELEASE_VERSION
          RELEASE_VERSION="$(tr -d ' \t\n\r' < ../DarkLab/docs/version.txt 2>/dev/null || true)"
          if [[ -f scripts/notify_ci_status.mjs ]]; then
            node scripts/notify_ci_status.mjs
          fi
      - name: Auto-fallback Publish company catalogue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::ACTIONS_PUSH_TOKEN missing; cannot dispatch catalogue publish."
            exit 1
          fi
          gh workflow run "Publish company catalogue" --repo fgalyasz/DarkLab --ref main
          echo "Dispatched Publish company catalogue as automatic fallback."
