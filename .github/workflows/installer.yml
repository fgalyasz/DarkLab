name: Installer image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  linux-bundle:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Build Linux bundle
        run: |
          chmod +x ./scripts/build_linux.sh
          ./scripts/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DarkLab-linux-x86_64
          path: dist/DarkLab-linux-x86_64.tar.gz
          if-no-files-found: error

  windows-bundle:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows bundle
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DarkLab-windows-x64
          path: dist/DarkLab-windows-x64.zip
          if-no-files-found: error

  dmg:
    needs: [linux-bundle, windows-bundle]
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: DarkLab
          ref: main
          fetch-depth: 0
          token: ${{ secrets.ACTIONS_PUSH_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: fgalyasz/TenPrintSoftware
          path: TenPrintSoftware
          ref: main
          fetch-depth: 0
          token: ${{ secrets.ACTIONS_PUSH_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install company site tools
        working-directory: TenPrintSoftware
        run: npm ci
      - name: Install native deps
        run: brew install inih
      - name: Import signing identity
        working-directory: DarkLab
        env:
          CODESIGN_P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
          CODESIGN_KEYCHAIN_PASSWORD: ${{ secrets.CODESIGN_KEYCHAIN_PASSWORD }}
        run: bash scripts/ci_import_signing.sh darklab-signing "DarkLab Local"
      - name: Build installer image
        working-directory: DarkLab
        run: |
          chmod +x ./scripts/build_dmg.sh ./scripts/ci_import_signing.sh ./scripts/ci_commit_release.sh
          ./scripts/build_dmg.sh
      - name: Restore Cloudflare login
        env:
          WRANGLER_CONFIG: ${{ secrets.WRANGLER_CONFIG }}
        run: |
          if [[ -n "${WRANGLER_CONFIG}" ]]; then
            mkdir -p "${HOME}/Library/Preferences/.wrangler/config"
            printf '%s\n' "${WRANGLER_CONFIG}" > "${HOME}/Library/Preferences/.wrangler/config/default.toml"
            chmod 600 "${HOME}/Library/Preferences/.wrangler/config/default.toml"
            cp "${HOME}/Library/Preferences/.wrangler/config/default.toml" "${RUNNER_TEMP}/wrangler-before.toml"
          fi
      - name: Deploy product site
        working-directory: DarkLab
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          chmod +x ./scripts/deploy_site.sh
          ./scripts/deploy_site.sh
      - name: Publish company catalogue
        working-directory: TenPrintSoftware
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm run sync:versions
          npm run build
          npm run deploy
      - name: Persist refreshed Cloudflare login
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PUSH_TOKEN }}
        run: |
          cfg="${HOME}/Library/Preferences/.wrangler/config/default.toml"
          before="${RUNNER_TEMP}/wrangler-before.toml"
          if [[ -s "${cfg}" ]] && [[ -f "${before}" ]] && ! cmp -s "${cfg}" "${before}"; then
            for repo in DarkLab SnappyZones SessionGuard WalkAway MarkSweep 8bitEmu; do
              gh secret set WRANGLER_CONFIG --repo "fgalyasz/${repo}" < "${cfg}"
            done
          fi
      - name: Commit version
        working-directory: DarkLab
        run: bash scripts/ci_commit_release.sh
      - name: Commit company catalogue version
        working-directory: DarkLab
        env:
          TENPRINT_ROOT: ${{ github.workspace }}/TenPrintSoftware
        run: bash scripts/ci_commit_release.sh company
      - uses: actions/upload-artifact@v4
        with:
          name: DarkLab-installer
          path: DarkLab/dist/DarkLab.dmg
          if-no-files-found: error
      - name: Notify on first success or recovery
        working-directory: TenPrintSoftware
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PUSH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
          CONTACT_FROM: ${{ secrets.CONTACT_FROM }}
        run: |
          RELEASE_VERSION="$(tr -d ' \t\n\r' < ../DarkLab/docs/version.txt 2>/dev/null || true)" \
            node scripts/notify_installer_recovery.mjs
