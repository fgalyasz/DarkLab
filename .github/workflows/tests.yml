name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install native deps for pyexiv2 (macOS)
        if: runner.os == 'macOS'
        run: brew install inih
      - run: python -m pip install -r requirements.txt
      - name: Run milestone smoke
        run: python scripts/milestone_smoke.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Run unit tests
        run: python -m unittest discover -s tests
        env:
          QT_QPA_PLATFORM: offscreen
