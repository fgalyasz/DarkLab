name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pyexiv2's macOS wheel links libexiv2 against Homebrew inih.
      - name: Install native deps for pyexiv2
        run: brew install inih
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
        env:
          QT_QPA_PLATFORM: offscreen
