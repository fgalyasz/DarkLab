name: CI watchdog

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Installer image", "Publish company catalogue"]
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-watchdog-${{ github.repository }}
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: fgalyasz/TenPrintSoftware
          ref: main
          token: ${{ secrets.ACTIONS_PUSH_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require push token
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::ACTIONS_PUSH_TOKEN missing on DarkLab; watchdog cannot intervene."
            exit 1
          fi
      - name: Scan studio pipelines and intervene
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PUSH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
          CONTACT_FROM: ${{ secrets.CONTACT_FROM }}
        run: node scripts/ci_watchdog.mjs
