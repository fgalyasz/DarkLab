name: Publish company catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows: ["Installer image"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: publish-catalogue-${{ github.repository }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: DarkLab
          ref: main
          fetch-depth: 0
          token: ${{ secrets.ACTIONS_PUSH_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: fgalyasz/TenPrintSoftware
          path: TenPrintSoftware
          ref: main
          fetch-depth: 0
          token: ${{ secrets.ACTIONS_PUSH_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: TenPrintSoftware/package-lock.json
      - name: Install
        working-directory: TenPrintSoftware
        run: npm ci
      - name: Restore Cloudflare login
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PUSH_TOKEN }}
          WRANGLER_CONFIG: ${{ secrets.WRANGLER_CONFIG }}
          WRANGLER_BIN: ${{ github.workspace }}/TenPrintSoftware/node_modules/.bin/wrangler
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "CLOUDFLARE_API_TOKEN present; skipping oauth restore."
            exit 0
          fi
          chmod +x DarkLab/scripts/ci_restore_wrangler.sh
          DarkLab/scripts/ci_restore_wrangler.sh
      - name: Sync, commit, build, deploy
        working-directory: TenPrintSoftware
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TENPRINT_ROOT: ${{ github.workspace }}/TenPrintSoftware
        run: |
          set -euo pipefail
          npm run sync:versions
          if [[ -n "$(git status --porcelain src/data/products.ts)" ]]; then
            bash ../DarkLab/scripts/ci_commit_release.sh company
          fi
          npm run build
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            npm run deploy
          else
            unset CLOUDFLARE_API_TOKEN
            npm run deploy
          fi
      - name: Persist refreshed Cloudflare login
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x DarkLab/scripts/ci_persist_wrangler.sh
          DarkLab/scripts/ci_persist_wrangler.sh force
